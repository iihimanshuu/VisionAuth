<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk to Your GitHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Talk to Your GitHub</h1>
        <input type="text" id="repoUrl" placeholder="Enter GitHub repo URL (e.g., https://github.com/owner/repo)">
        <input type="text" id="question" placeholder="Ask a question about the code">
        <input type="password" id="token" placeholder="GitHub Personal Access Token">
        <button id="askBtn">Ask</button>
        <div id="response"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
